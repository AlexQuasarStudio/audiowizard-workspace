<!-- Дудл-маска заставки: только вектор (SVG), без растрового тайла —
       на retina и при зуме растр давал мыло. Грузим маску до стилей и не
       показываем заставку, пока она не готова: первый кадр сразу с узором. -->
<link rel="preload" as="image" href="bg/pattern-ai.svg?v=1561" type="image/svg+xml" fetchpriority="high">
<script>
  (function(){
    var h = document.documentElement;
    h.classList.add('splash-hold');
    /* Снимаем заставку после двух кадров: preload говорит только о загрузке
       файла, а маска накладывается при первой отрисовке. Ждём кадр, где
       узор уже стоит, и только потом показываем экран. */
    var done = function(){
      if (!h.classList.contains('splash-hold')) return;
      var drop = function(){ h.classList.remove('splash-hold'); };
      if (window.requestAnimationFrame) requestAnimationFrame(function(){ requestAnimationFrame(drop); });
      else drop();
    };
    /* Ждём тот же preload, а не создаём второй Image: раньше узор качался
       дважды — объектом и маской. Страховка снимает заставку, если сеть
       задержалась: первый кадр важнее идеальной готовности узора. */
    var link = document.querySelector('link[rel="preload"][as="image"][href$="pattern-ai.svg?v=1561"]');
    if (link){
      link.addEventListener('load', function(){ setTimeout(done, 0); }, { once:true });
      link.addEventListener('error', done, { once:true });
    } else done();
    setTimeout(done, 1200);
  })();
</script>
